name: release-binary

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      brave_core_ref:
        description: "brave-core ref (branch, tag, or SHA)"
        required: false
        default: "master"
      brave_core_repo:
        description: "brave-core repo (owner/name)"
        required: false
        default: "lake-of-fire/brave-core"

permissions:
  contents: write

jobs:
  build-release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: macos-14
    env:
      BRAVE_CORE_REPO: ${{ github.event.inputs.brave_core_repo || 'lake-of-fire/brave-core' }}
      BRAVE_CORE_REF: ${{ github.event.inputs.brave_core_ref || 'master' }}
      BRAVE_CORE_TOKEN: ${{ secrets.BRAVE_CORE_TOKEN }}
    steps:
      - name: Checkout swift-brave
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SWIFT_BRAVE_TOKEN || github.token }}

      - name: Checkout brave-core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BRAVE_CORE_REPO }}
          ref: ${{ env.BRAVE_CORE_REF }}
          path: brave-core
          token: ${{ secrets.BRAVE_CORE_TOKEN || github.token }}

      - name: Prepare brave-core
        run: |
          set -euo pipefail
          core_dir="${RUNNER_TEMP}/brave-core"
          rm -rf "$core_dir"
          mv brave-core "$core_dir"
          echo "BRAVE_CORE_DIR=$core_dir" >> "$GITHUB_ENV"

          if [ ! -d "$core_dir/spm/templates/swift-brave" ]; then
            git -C "$core_dir" checkout HEAD -- spm/templates/swift-brave || true
          fi
          if [ ! -d "$core_dir/spm/templates/swift-brave" ]; then
            echo "Templates missing in checkout; fetching archive..."
            token="${BRAVE_CORE_TOKEN:-}"
            auth_header=""
            if [ -n "$token" ]; then
              auth_header="Authorization: Bearer ${token}"
            fi
            repo="$BRAVE_CORE_REPO"
            ref="$BRAVE_CORE_REF"
            archive_url="https://github.com/${repo}/archive/${ref}.tar.gz"
            tmp_dir="$(mktemp -d)"
            archive_path="${tmp_dir}/brave-core.tar.gz"
            if [ -n "$auth_header" ]; then
              curl -fL -H "$auth_header" "$archive_url" -o "$archive_path"
            else
              curl -fL "$archive_url" -o "$archive_path"
            fi
            tar -xzf "$archive_path" -C "$tmp_dir"
            prefix="$(tar -tf "$archive_path" | head -1 | cut -d/ -f1)"
            src_path="${tmp_dir}/${prefix}/spm/templates/swift-brave"
            if [ -d "$src_path" ]; then
              mkdir -p "$core_dir/spm/templates"
              cp -R "$src_path" "$core_dir/spm/templates/"
            fi
          fi
          if [ ! -d "$core_dir/spm/templates/swift-brave" ]; then
            echo "Missing templates at $core_dir/spm/templates/swift-brave"
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build swift-brave
        run: |
          set -euo pipefail
          "$BRAVE_CORE_DIR/make-spm" "$GITHUB_WORKSPACE"

      - name: Zip xcframework
        run: |
          set -euo pipefail
          cd Binary
          zip -r ../BraveAdblockCore.xcframework.zip BraveAdblockCore.xcframework

      - name: Compute checksum
        id: checksum
        run: |
          set -euo pipefail
          checksum=$(swift package compute-checksum BraveAdblockCore.xcframework.zip)
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "$checksum" > BraveAdblockCore.xcframework.checksum

      - name: Set release tag
        id: tag
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short=12 HEAD)
          echo "tag=binary-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            BraveAdblockCore.xcframework.zip
            BraveAdblockCore.xcframework.checksum

      - name: Update Package.swift for binary target
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          package_path = Path("Package.swift")
          text = package_path.read_text()
          url = os.environ["BINARY_URL"]
          checksum = os.environ["BINARY_CHECKSUM"]
          replacement = (
              '.binaryTarget(\n'
              '            name: "BraveAdblockCore",\n'
              f'            url: "{url}",\n'
              f'            checksum: "{checksum}"\n'
              '        ),'
          )

          lines = text.splitlines(keepends=True)
          out = []
          i = 0
          replaced = False

          while i < len(lines):
              line = lines[i]
              if ".binaryTarget(" not in line:
                  out.append(line)
                  i += 1
                  continue

              block_lines = [line]
              depth = line.count("(") - line.count(")")
              i += 1
              while i < len(lines) and depth > 0:
                  line = lines[i]
                  block_lines.append(line)
                  depth += line.count("(") - line.count(")")
                  i += 1

              block_text = "".join(block_lines)
              if 'name: "BraveAdblockCore"' in block_text:
                  indent = block_lines[0].split(".binaryTarget")[0]
                  out.append(indent + replacement.replace("\n", "\n" + indent).rstrip() + "\n")
                  replaced = True
              else:
                  out.extend(block_lines)

          if not replaced:
              raise SystemExit("Could not find BraveAdblockCore binaryTarget in Package.swift")

          package_path.write_text("".join(out))
          PY
        env:
          BINARY_URL: ${{ format('https://github.com/{0}/releases/download/{1}/BraveAdblockCore.xcframework.zip', github.repository, steps.tag.outputs.tag) }}
          BINARY_CHECKSUM: ${{ steps.checksum.outputs.checksum }}

      - name: Commit manifest update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          if git diff --cached --quiet; then
            echo "No Package.swift changes to commit."
            exit 0
          fi
          git commit -m "chore: update binary target [skip ci]"
          git push
